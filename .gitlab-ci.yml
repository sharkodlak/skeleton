# The skeleton ships CI for both hosts; delete the one this project does not
# use. Both are deliberately thin — everything they run lives in the Makefile,
# so neither file becomes a second source of truth.
stages:
  - qa

qa:
  stage: qa
  image: docker:28-cli
  timeout: 30m

  # Unlike GitHub's runners, a GitLab docker executor has no Docker daemon of
  # its own; dind provides one. A runner with the host socket mounted can drop
  # both the service and DOCKER_HOST.
  services:
    - docker:28-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''

  before_script:
    - apk add --no-cache make

  script:
    - docker compose version
    # Same reason as the GitHub workflow: name the compose command rather
    # than let the Makefile probe for one.
    - make COMPOSE="docker compose" ci

  after_script:
    - docker compose logs --no-color || true

  artifacts:
    when: always
    paths:
      - var/coverage/
    expire_in: 1 week
