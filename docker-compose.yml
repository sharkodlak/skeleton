version: '3.8'
services:
    db:
        container_name: db
        build:
            dockerfile: containers/images/postgre/Containerfile
            context: .
        volumes:
            - dbData:/var/lib/postgresql
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASS}
            POSTGRES_DB: ${DB_NAME}
        ports:
            - '5432:5432'

    php:
        container_name: php
        build:
            dockerfile: containers/images/php/Containerfile
            context: .
            target: development
        volumes:
            - ./:/app:cached
            - ~/.composer:/root/.composer:delegated
        working_dir: /app
        env_file:
            - .env
        links:
            - db

    web:
        container_name: web
        build:
            dockerfile: containers/images/nginx/Containerfile
            context: .
        volumes:
            - ./:/app:cached
        environment:
            - NGINX_SERVER_NAME=localhost
        working_dir: /app
        ports:
            - '8080:80'
        links:
            - php

volumes:
    dbData:
