version: '3.8'
services:
    db:
        container_name: db
        build:
            dockerfile: containers/images/postgre/Containerfile
            context: .
        volumes:
            - ./:/app:cached
            - dbData:/var/lib/postgresql
        working_dir: /app
        environment:
            POSTGRES_USER: root
            POSTGRES_PASSWORD: root
            GROUP: app
            MAIN_ROLE: appowner
            MAIN_ROLE_PASS: appowner
            DB_NAME: app
            READONLY_ROLE: readonly
            READONLY_ROLE_PASSWORD: readonly
        ports:
            - '5432:5432'

    php:
        container_name: php
        build:
            dockerfile: containers/images/php/Containerfile
            context: .
            target: development
        volumes:
            - ./:/app:cached
            - ~/.composer:/root/.composer:delegated
        working_dir: /app
        links:
            - db

    web:
        container_name: web
        build:
            dockerfile: containers/images/nginx/Containerfile
            context: .
        volumes:
            - ./:/app:cached
        environment:
            - NGINX_SERVER_NAME=localhost
        working_dir: /app
        ports:
            - '8080:80'
        links:
            - php

volumes:
    dbData:
