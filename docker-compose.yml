services:
    db:
        container_name: db
        build:
            dockerfile: containers/images/postgre/Containerfile
            context: .
        volumes:
            - dbData:/var/lib/postgresql
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASS}
            POSTGRES_DB: ${DB_NAME}
        ports:
            - '5432:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s

    php:
        container_name: php
        build:
            dockerfile: containers/images/php/Containerfile
            context: .
            target: development
        volumes:
            - ./:/app:cached
            - ~/.composer:/root/.composer:delegated
        working_dir: /app
        env_file:
            - .env
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test: ['CMD-SHELL', 'test -f /tmp/app-ready']
            interval: 5s
            timeout: 3s
            retries: 60
            start_period: 10s

    web:
        container_name: web
        build:
            dockerfile: containers/images/nginx/Containerfile
            context: .
        volumes:
            - ./:/app:cached
        environment:
            - NGINX_SERVER_NAME=localhost
        working_dir: /app
        ports:
            - '8080:80'
        depends_on:
            php:
                condition: service_healthy

volumes:
    dbData:
