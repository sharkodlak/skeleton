name: QA

on:
  push:
    branches: ['**']
  pull_request:

# A newer push to the same branch makes the running job pointless.
concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      # The Makefile picks a compose command by probing what is installed, which
      # is right on a developer machine and wrong here: a runner has several
      # container tools and the choice would depend on image contents that
      # change without notice. CI states which one it means.
      - name: Toolchain
        run: |
          docker compose version
          make --version | head -1

      - name: Build, start and run the QA suite
        run: make COMPOSE="docker compose" ci

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage
          path: var/coverage/
          if-no-files-found: ignore
