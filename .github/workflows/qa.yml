name: QA

on:
  push:
    branches: ['**']
  pull_request:

# A newer push to the same branch makes the running job pointless.
concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # `make ci` builds the project's own images and runs exactly what a
      # developer runs, so CI never grows a second definition of the PHP
      # version, its extensions or the web server. GitHub runners ship
      # docker compose, which the Makefile detects on its own.
      - name: Build, start and run the QA suite
        run: make ci

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: var/coverage/
          if-no-files-found: ignore
