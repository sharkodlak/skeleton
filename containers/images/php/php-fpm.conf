[www]
user = www-data
group = www-data

listen = 9000

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Mirrors the request id nginx logs, so one request can be followed from the
; access log through FPM into the application log.
access.format = "%R - %u %t \"%m %r\" %s %{HTTP_X_REQUEST_ID}e"
