[xdebug]
; The mode comes from the XDEBUG_MODE environment variable, which Xdebug 3 reads
; on its own; the Containerfile defaults it to "off". Leaving coverage or debug
; permanently on costs real time on every request and every test run.
;   XDEBUG_MODE=debug make in        # step debugging
;   XDEBUG_MODE=coverage make qa     # coverage report

; Sessions start only when asked for — via the XDEBUG_TRIGGER environment
; variable, which `make qa` and `make fix` forward, or a cookie or query
; parameter from the browser.
xdebug.start_with_request=trigger

xdebug.client_host=host.containers.internal
xdebug.client_port=9003
xdebug.connect_timeout_ms=2000
xdebug.idekey=VSCODE

; Must stay off: behind nginx, REMOTE_ADDR is the web container, so discovery
; would make Xdebug dial the web container instead of the developer's machine
; and fail silently.
xdebug.discover_client_host=false

xdebug.log_level=0
xdebug.output_dir=/tmp
